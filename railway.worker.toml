# DOCUMENTATION OF the `tawveeri-worker` Railway service's build/deploy config —
# NOT live config-as-code. CONFIRMED 2026-09-17 via a direct `serviceInstanceUpdate`
# API call: Railway now REJECTS setting `railwayConfigFile` with "Config as Code
# (railway.json / railway.toml) is deprecated. Use Infrastructure as Code
# (.railway/railway.ts) instead." This file is therefore NOT read by Railway for
# this (or any) service — it exists only as a human-readable record of what the
# service's actual settings should be. The real, live settings are `startCommand`/
# etc. set directly on the service instance via `serviceInstanceUpdate` (the same
# mechanism `railway.founder-report-cron.toml`'s own root-cause note from
# 2026-08-07 describes working around the shared root railway.toml's startCommand).
# Whenever this file is edited, the matching `serviceInstanceUpdate` API call MUST
# be made too, or the live service silently keeps the old value.
#
# `buildCommand` OVERRIDE DOES NOT WORK FOR THIS SERVICE (found live, 2026-09-17,
# confirmed across two full deploy cycles including one genuine cache-busted
# rebuild — not a caching artifact): a `serviceInstanceUpdate` buildCommand value
# is accepted, persisted, and echoed back by the API, but Railpack does not
# actually apply it for this auto-detected Node/Next.js project — the real build
# kept running the ROOT railway.toml's buildCommand regardless of what was set
# here. `buildCommand` below is therefore left matching what actually runs
# (inherited from the shared root railway.toml), NOT used for anything custom.
# `startCommand`, by contrast, IS reliably applied — proven by a real crash loop
# when it was made to depend on a build-time artifact that never got built, and
# by a clean recovery when reverted. The tini fetch below runs as a startCommand
# prefix instead, for exactly this reason.
#
# This service NEVER opens an HTTP listener and NEVER imports src/instrumentation.ts
# — it is a plain long-lived Node process, not the Next.js app.
[build]
builder = "RAILPACK"
buildCommand = "npm install --legacy-peer-deps && npm run build"

[deploy]
# `node scripts/worker/fetch-tini.js` runs first, at CONTAINER START (not
# build time — see the buildCommand note above for why). It installs tini
# (v0.19.0, upstream static amd64 build from krallin/tini's own GitHub
# Releases, sha256-pinned, fails closed on mismatch) into ./bin/tini.
# FIXED 2026-09-18 (founder review — startup must not depend on an external
# download): the PRIMARY source is now the binary committed directly in this
# repo at scripts/worker/bin/tini (~24KB, verified by hash before every use)
# — zero network dependency on the common path. A GitHub download is kept
# ONLY as a fallback if the committed copy is ever missing or fails its hash
# check. Either way it verifies an already-installed copy's hash first and
# skips all work on an ordinary restart-policy restart (same container
# filesystem — only a fresh deploy gets an empty one). tini then runs as
# PID 1: it forwards signals to the real worker process unchanged
# (so the existing SIGTERM handling in scripts/worker/index.ts and the
# price-update.ts SIGTERM cascade are untouched) and additionally reaps ANY
# reparented descendant, closing a real, proven gap — found live, 2026-09-17,
# via an isolated fixture test on the real production container
# (docs/DECISIONS.md ADR pending): this worker's own Node process runs AS
# PID 1 with no reaper, so when a middle process in a 3+-level spawn chain
# (worker -> price-update.ts -> price-update-store.ts -> Chromium, or the
# Samsung pipeline's own nested children) is killed, its still-alive children
# reparent to PID 1 and are never reaped (confirmed: still zombie/defunct at
# 15s+). Not yet acute (current Stage 1 jobs are only 2 levels deep) but a
# real risk once local-Chromium fallback or Samsung's nested scripts run.
# tini is the same fix Docker's own `--init` flag uses — a single-purpose,
# ~23KB, zero-dependency init binary; a JS-level reaper isn't possible
# (reaping requires an actual waitpid() syscall by the real parent, which
# plain Node cannot issue without a native binding). `--` is required so
# tini does not try to parse node's own args.
startCommand = "node scripts/worker/fetch-tini.js && bin/tini -- node --import tsx scripts/worker/index.ts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# No healthcheckPath: this service has no HTTP server to probe. Liveness is the
# tps_scheduler_heartbeat row it writes every 60s (same table/shape the old
# in-process scheduler used) plus Railway's own deployment/process status.
