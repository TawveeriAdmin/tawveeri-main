<title>بوابة المقارنة العمياء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one pair at a time (two listings side by side, stacked on phones), attribute table under them, three answer buttons, a numbered strip to jump anywhere. */
:root {
  --bg: #eef1ef;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --ink: #15211c;
  --ink-2: #53635b;
  --line: #d5ddd9;
  --accent: #0e5c47;
  --same: #0e6b4d;
  --same-bg: #dcf0e7;
  --diff: #a23a22;
  --diff-bg: #f6e1da;
  --unsure: #7a5a0f;
  --unsure-bg: #f4ead1;
  --focus: #1d4ed8;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101714; --surface: #18221e; --surface-2: #1e2a25; --ink: #e8f0ec; --ink-2: #97aaa1; --line: #2b3a34;
    --accent: #5cc9a3; --same: #6fd6ae; --same-bg: #17382c; --diff: #f09a82; --diff-bg: #3d211a;
    --unsure: #e6c46c; --unsure-bg: #3a3017; --focus: #7aa2ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101714; --surface: #18221e; --surface-2: #1e2a25; --ink: #e8f0ec; --ink-2: #97aaa1; --line: #2b3a34;
  --accent: #5cc9a3; --same: #6fd6ae; --same-bg: #17382c; --diff: #f09a82; --diff-bg: #3d211a;
  --unsure: #e6c46c; --unsure-bg: #3a3017; --focus: #7aa2ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; margin: 0; padding-inline: 16px; padding-block: 16px 96px; }
main { max-width: 920px; margin-inline: auto; display: grid; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.top { display: grid; gap: 10px; }
.top h1 { font-size: 1.35rem; margin: 0; font-weight: 700; text-wrap: balance; }
.top p { margin: 0; color: var(--ink-2); max-width: 65ch; }
.meter { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar { flex: 1 1 200px; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.meter b { font-variant-numeric: tabular-nums; }
.savenote { font-size: .85rem; color: var(--ink-2); }
.savenote.warn { color: var(--diff); }

.pair { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 16px; }
.pairhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pairhead .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.pairhead .cat { color: var(--ink-2); }
.listings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.listing { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; min-width: 0; display: grid; gap: 6px; align-content: start; }
.store { font-weight: 700; font-size: .95rem; color: var(--accent); }
.title { font-family: var(--mono); font-size: .86rem; line-height: 1.55; overflow-wrap: anywhere; unicode-bidi: plaintext; text-align: start; }
.title[dir="rtl"] { font-family: var(--font); font-size: .95rem; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { padding: 7px 10px; text-align: start; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; color: var(--ink-2); font-weight: 600; font-size: .8rem; letter-spacing: .02em; }
tbody th { font-weight: 500; color: var(--ink-2); white-space: nowrap; }
td { overflow-wrap: anywhere; min-width: 0; }
td.mono { font-family: var(--mono); font-size: .85rem; unicode-bidi: plaintext; }
td.none { color: var(--ink-2); }

.question { font-weight: 600; margin: 0; text-wrap: balance; }
.hint { margin: 2px 0 0; color: var(--ink-2); font-size: .85rem; font-weight: 400; }
.answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ans { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 14px 10px; min-height: 64px; display: grid; gap: 2px; justify-items: center; align-content: center; text-align: center; font-weight: 700; }
.ans small { font-weight: 400; color: var(--ink-2); font-size: .78rem; direction: ltr; }
.ans[data-a="SAME"]:hover, .ans[data-a="SAME"][aria-pressed="true"] { border-color: var(--same); }
.ans[data-a="DIFF"]:hover, .ans[data-a="DIFF"][aria-pressed="true"] { border-color: var(--diff); }
.ans[data-a="UNSURE"]:hover, .ans[data-a="UNSURE"][aria-pressed="true"] { border-color: var(--unsure); }
.ans[data-a="SAME"][aria-pressed="true"] { background: var(--same-bg); color: var(--same); }
.ans[data-a="DIFF"][aria-pressed="true"] { background: var(--diff-bg); color: var(--diff); }
.ans[data-a="UNSURE"][aria-pressed="true"] { background: var(--unsure-bg); color: var(--unsure); }
.nav { display: flex; justify-content: space-between; gap: 10px; }
.nav button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 16px; min-height: 44px; }
.nav button:disabled { opacity: .4; cursor: default; }

.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
.dot { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; min-height: 36px; font-size: .8rem; font-variant-numeric: tabular-nums; }
.dot[data-a="SAME"] { background: var(--same-bg); border-color: var(--same); }
.dot[data-a="DIFF"] { background: var(--diff-bg); border-color: var(--diff); }
.dot[data-a="UNSURE"] { background: var(--unsure-bg); border-color: var(--unsure); }
.dot[aria-current="true"] { outline: 3px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; color: var(--ink-2); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; background: var(--line); }
.legend .s::before { background: var(--same); } .legend .d::before { background: var(--diff); } .legend .u::before { background: var(--unsure); }
.done { background: var(--same-bg); color: var(--same); border-radius: 10px; padding: 14px 16px; font-weight: 600; }

@media (max-width: 640px) {
  .listings { grid-template-columns: 1fr; }
  .answers { grid-template-columns: 1fr; }
  .ans { min-height: 56px; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<main>
  <header class="top">
    <h1>بوابة المقارنة العمياء</h1>
    <p>٨٤ زوجًا من القوائم. لكل زوج اختر جوابًا واحدًا: هل القائمتان هما نفس المنتج التجاري بالضبط، بحيث يصح أن يُحسب سعراهما كسعر منتج واحد؟ اللون وحده لا يغيّر الجواب. لا توجد إجابات صحيحة معروضة هنا.</p>
    <div class="meter">
      <div class="bar" role="progressbar" aria-label="التقدم" aria-valuemin="0" aria-valuemax="84" id="bar"><i id="barfill"></i></div>
      <span><b id="count">٠</b> من ٨٤</span>
    </div>
    <div class="savenote" id="savenote">جارٍ تجهيز الحفظ…</div>
  </header>

  <section class="pair" id="pair" aria-live="polite"></section>

  <section aria-label="كل الأزواج" style="display:grid;gap:10px">
    <div class="legend"><span class="s">نفس المنتج</span><span class="d">مختلف</span><span class="u">غير متأكد</span></div>
    <div class="strip" id="strip"></div>
  </section>
  <div id="doneBox"></div>
</main>

label":"العلامة التجارية","a":"Honor","b":"Honor"},{"k":"model","label":"رقم الموديل","a":"غير مذكور","b":"غير مذكور"},{"k":"condition","label":"الحالة","a":"لم تُذكر","b":"لم تُذكر"},{"k":"storage","label":"السعة التخزينية","a":"128 جيجا","b":"128 جيجا"},{"k":"ram","label":"الذاكرة (RAM)","a":"4 جيجا","b":"4 جيجا"},{"k":"network","label":"الشبكة","a":"4G / LTE","b":"4G / LTE"},{"k":"edition","label":"النسخة / المنطقة","a":"لم يُذكر","b":"نسخة دولية/خارجية"}]},{"n":83,"id":"P184","cat":"جوال","a":{"store":"أمازون","title":"Xiaomi Redmi 15C Smartphone 8,256GB,mint green,6000mAh Battery | 120Hz 6.9\" Display, Stylish Design, 50MP AI Dual Camera, 33W Fast Charging - Global Version"},"b":{"store":"إكسترا","title":"Xiaomi Redmi 15C, 4G, 256 GB, Mint Green"},"rows":[{"k":"brand","label":"العلامة التجارية","a":"Xiaomi","b":"Xiaomi"},{"k":"model","label":"رقم الموديل","a":"غير مذكور","b":"غير مذكور"},{"k":"condition","label":"الحالة","a":"لم تُذكر","b":"لم تُذكر"},{"k":"storage","label":"السعة التخزينية","a":"256 جيجا","b":"256 جيجا"},{"k":"network","label":"الشبكة","a":"لم تُذكر","b":"4G / LTE"},{"k":"edition","label":"النسخة / المنطقة","a":"نسخة دولية/خارجية","b":"لم يُذكر"}]},{"n":84,"id":"P036","cat":"جوال","a":{"store":"أمازون","title":"Redmi 15C Midnight Black 8GB RAM 256GB 4G - Global Version"},"b":{"store":"إكسترا","title":"Xiaomi Redmi 15C, 4G, 256 GB, Mint Green"},"rows":[{"k":"brand","label":"العلامة التجارية","a":"غير محددة","b":"Xiaomi"},{"k":"model","label":"رقم الموديل","a":"غير مذكور","b":"غير مذكور"},{"k":"condition","label":"الحالة","a":"لم تُذكر","b":"لم تُذكر"},{"k":"storage","label":"السعة التخزينية","a":"256 جيجا","b":"256 جيجا"},{"k":"ram","label":"الذاكرة (RAM)","a":"8 جيجا","b":"لم تُذكر"},{"k":"network","label":"الشبكة","a":"4G / LTE","b":"4G / LTE"},{"k":"edition","label":"النسخة / المنطقة","a":"نسخة دولية/خارجية","b":"لم يُذكر"}]}];
const LABEL = { SAME: "نفس المنتج تمامًا", DIFF: "منتج أو إصدار مختلف", UNSURE: "غير متأكد" };
const EN = { SAME: "SAME EXACT PRODUCT", DIFF: "DIFFERENT PRODUCT / VARIANT", UNSURE: "UNSURE" };
const AR_DIGITS = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
let idx = 0, answers = {}, db = null, saveMode = "pending";

try { const s = localStorage.getItem("bg_idx"); if (s) idx = Math.min(Math.max(+s || 0, 0), SHEET.length - 1); } catch (e) {}
try { const l = JSON.parse(localStorage.getItem("bg_local") || "{}"); if (l && typeof l === "object") answers = l; } catch (e) {}

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const isRtl = (s) => /[؀-ۿ]/.test(s);

function renderPair() {
  const p = SHEET[idx], box = $("pair"); box.textContent = "";
  const head = el("div", "pairhead"); head.append(el("span", "n", "الزوج " + AR_DIGITS(p.n) + " من " + AR_DIGITS(SHEET.length)), el("span", "cat", p.cat)); box.append(head);
  const ls = el("div", "listings");
  for (const side of [p.a, p.b]) { const l = el("div", "listing"); l.append(el("div", "store", side.store)); const t = el("div", "title", side.title); t.dir = isRtl(side.title) ? "rtl" : "ltr"; l.append(t); ls.append(l); }
  box.append(ls);
  const wrap = el("div", "tablewrap"), tb = el("table"), thead = el("thead"), hr = el("tr");
  hr.append(el("th", null, ""), el("th", null, p.a.store), el("th", null, p.b.store)); thead.append(hr); tb.append(thead);
  const body = el("tbody");
  for (const r of p.rows) { const tr = el("tr"); tr.append(el("th", null, r.label)); for (const v of [r.a, r.b]) { const none = /^(غير|لم)/.test(v); const td = el("td", (r.k === "model" ? "mono " : "") + (none ? "none" : ""), v); tr.append(td); } body.append(tr); }
  tb.append(body); wrap.append(tb); box.append(wrap);
  const q = el("p", "question", "هل هما نفس المنتج التجاري بالضبط؟"); box.append(q);
  const ans = el("div", "answers");
  for (const k of ["SAME", "DIFF", "UNSURE"]) { const b = el("button", "ans"); b.type = "button"; b.dataset.a = k; b.setAttribute("aria-pressed", answers[p.id] === k ? "true" : "false"); b.append(el("span", null, LABEL[k]), el("small", null, EN[k])); b.addEventListener("click", () => choose(k)); ans.append(b); }
  box.append(ans);
  const nav = el("div", "nav"); const prev = el("button", null, "السابق"), next = el("button", null, "التالي");
  prev.type = next.type = "button"; prev.disabled = idx === 0; next.disabled = idx === SHEET.length - 1;
  prev.addEventListener("click", () => go(idx - 1)); next.addEventListener("click", () => go(idx + 1));
  nav.append(prev, next); box.append(nav);
}

function renderStrip() {
  const s = $("strip"); s.textContent = "";
  SHEET.forEach((p, i) => { const b = el("button", "dot", AR_DIGITS(p.n)); b.type = "button"; if (answers[p.id]) b.dataset.a = answers[p.id]; if (i === idx) b.setAttribute("aria-current", "true"); b.setAttribute("aria-label", "الزوج " + p.n + (answers[p.id] ? "، " + LABEL[answers[p.id]] : "، بلا جواب")); b.addEventListener("click", () => go(i)); s.append(b); });
}
function renderMeter() {
  const done = SHEET.filter((p) => answers[p.id]).length;
  $("count").textContent = AR_DIGITS(done); $("barfill").style.width = (done / SHEET.length * 100) + "%"; $("bar").setAttribute("aria-valuenow", done);
  const d = $("doneBox"); d.textContent = "";
  if (done === SHEET.length) { const x = el("div", "done", "اكتملت الإجابات على الأزواج الـ٨٤. أخبر Claude أنك انتهيت وسأقارنها بالمرجع وأعرض الاتفاق والاختلافات."); d.append(x); }
}
function renderNote() {
  const n = $("savenote"); n.classList.remove("warn");
  if (saveMode === "db") n.textContent = "تُحفظ كل إجابة تلقائيًا ويمكنك الرجوع وتغييرها.";
  else if (saveMode === "local") { n.textContent = "الحفظ على هذا المتصفح فقط. Claude لن يرى إجاباتك حتى تُفتح الصفحة بحساب يسمح بالحفظ."; n.classList.add("warn"); }
  else n.textContent = "جارٍ تجهيز الحفظ…";
}
function renderAll() { renderPair(); renderStrip(); renderMeter(); renderNote(); }
function go(i) { idx = Math.min(Math.max(i, 0), SHEET.length - 1); try { localStorage.setItem("bg_idx", String(idx)); } catch (e) {} renderAll(); window.scrollTo({ top: 0 }); }

async function choose(k) {
  const p = SHEET[idx]; answers[p.id] = k;
  try { localStorage.setItem("bg_local", JSON.stringify(answers)); } catch (e) {}
  renderStrip(); renderMeter(); renderPair();
  if (db) { try { await db.doc("blind/" + p.id).set({ answer: k, n: p.n, at: new Date().toISOString() }); } catch (e) { saveMode = "local"; renderNote(); } }
  if (idx < SHEET.length - 1) setTimeout(() => go(idx + 1), 220);
}

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "1") choose("SAME"); else if (e.key === "2") choose("DIFF"); else if (e.key === "3") choose("UNSURE");
});

renderAll();

(async () => {
  try {
    const c = window.claude; db = c && c.use ? await c.use("db") : null;
    if (!db) { saveMode = "local"; renderNote(); return; }
    saveMode = "db"; renderNote();
    db.collection("blind").onSnapshot((snap) => {
      const remote = {}; snap.docs.forEach((d) => { const v = d.data(); if (v && v.answer) remote[d.id] = v.answer; });
      // Answers already saved in the store win; answers only held in this browser are pushed up once.
      const merged = Object.assign({}, answers, remote); const pending = Object.keys(answers).filter((id) => !remote[id]);
      answers = merged; try { localStorage.setItem("bg_local", JSON.stringify(answers)); } catch (e) {}
      renderStrip(); renderMeter(); renderPair();
      if (!window.__pushed) { window.__pushed = true; pending.reduce((pr, id) => pr.then(() => db.doc("blind/" + id).set({ answer: answers[id], n: (SHEET.find((x) => x.id === id) || {}).n || 0, at: new Date().toISOString() })).catch(() => {}), Promise.resolve()); }
    }, () => { saveMode = "local"; renderNote(); });
  } catch (e) { saveMode = "local"; renderNote(); }
})();
</script>
