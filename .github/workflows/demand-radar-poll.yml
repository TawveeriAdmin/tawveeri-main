# Demand Radar Poll — durable external scheduling (ADR-280, 2026-08-31)
#
# WHY THIS EXISTS
# Demand Radar's poll used to be an in-process setInterval inside the web server
# (src/instrumentation.ts). It reset every time the process restarted — on every deploy.
# Measured on real production data (2026-08-30 24h audit): ~20 real poll cycles logged against
# ~144 expected at the intended 10-minute cadence, with gaps up to ~4 hours. The opportunity
# engine must not silently stop during deploys/restarts (founder requirement) — an in-process
# timer structurally cannot satisfy that.
#
# WHY GITHUB ACTIONS
# Same reasoning as health-watch.yml/tps-heartbeat.yml, which already run production triggers
# from this repo's Actions on the same secret store: it runs OUTSIDE Railway, so it still fires
# when the web server itself restarts or is between deploys. No new vendor, no new account, no
# new secret — CRON_SECRET is already a configured repo secret (tps-heartbeat.yml uses it today).
#
# HONEST LIMITS
#   - GitHub cron can be delayed by minutes under load; treat the cadence as "~10 min", not exact
#     (same caveat health-watch.yml documents for its own */15 schedule).
#   - If GitHub Actions itself is down, no poll fires — same class of risk the in-process
#     interval had with a Railway/process outage, not a new failure mode.
#   - Runs REAL X polling (source: "x", the default when no body is sent) — this is not a test
#     tick. Disabling this workflow (repo Settings > Actions, or unset X_RADAR_BEARER_TOKEN on
#     Railway) is the way to pause Radar 1 polling.

name: Demand Radar Poll

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# A queued run is worthless once a newer one exists — the route is itself cursor-based and
# idempotent, but there is no reason to let runs pile up under GitHub load.
concurrency:
  group: demand-radar-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger Demand Radar tick
        run: |
          set -uo pipefail
          code=$(curl -s -o /tmp/response.json -w '%{http_code}' --max-time 300 \
            -X POST "https://tawveeri.com/api/cron/demand-radar" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "http_status=$code"
          cat /tmp/response.json
          if [ "$code" != "200" ]; then
            echo "::error title=Demand Radar poll failed::HTTP $code"
            exit 1
          fi
