name: TPS Heartbeat

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  jarir-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jarir discovery
        run: |
          curl -s -X POST "https://tawveeri.com/api/cron/discover-products" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"store_slug":"jarir","max_pages":3}' \
            --max-time 800