# retrigger: report endpoint now deployed
name: Noon Egress Probe (temporary diagnostic)

on:
  push:
    paths:
      - '.github/workflows/noon-egress-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Noon from GitHub Actions egress (single requests, no retry, no evasion)
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

          probe() {
            name="$1"; url="$2"; shift 2
            t0=$(date +%s%3N)
            code=$(curl -s -o /tmp/body.txt -m 20 -w "%{http_code}" "$url" "$@")
            t1=$(date +%s%3N)
            len=$(wc -c < /tmp/body.txt | tr -d ' ')
            elapsed=$((t1-t0))
            echo "probe=$name http_code=$code elapsed_ms=$elapsed body_length=$len"

            printf '{"source":"github-actions","probe":"%s","http_code":"%s","elapsed_ms":%s,"body_length":%s}' \
              "$name" "$code" "$elapsed" "$len" > /tmp/payload.json
            cat /tmp/payload.json
            echo ""
            curl -s -X POST "https://tawveeri.com/api/admin/diagnostics/egress-report" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/payload.json \
              --max-time 20 -w "\nreport_status=%{http_code}\n"
          }

          probe "homepage" "https://www.noon.com/" -A "$UA"
          sleep 3

          probe "json_search_api" "https://www.noon.com/_svc/catalog/api/v3/u/en-sa/search?q=tv&page=1&limit=5" \
            -A "$UA" -H "Accept: application/json, text/plain, */*" -H "Origin: https://www.noon.com" \
            -H "Referer: https://www.noon.com/saudi-en/" -H "x-locale: en-sa" -H "x-platform: web" -H "x-content: desktop"
          sleep 3

          probe "product_detail_page" "https://www.noon.com/saudi-en/65-inch-65c6k-pro-qd-mini-led-4k-tv-google-tv-144hz-refresh-rate-onkyo-audio-system-65gb-internal-storage-65c6k-pro-black/N70378054V/p/" -A "$UA"
